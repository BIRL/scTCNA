# Render Blueprint for the scTCNA web app (https://render.com/docs/blueprint-spec).
#
# Free web service built from the Dockerfile: 512 MB RAM, shared CPU, no card needed.
# It spins down after 15 minutes without traffic and wakes on the next request
# (about a minute). The app only serves the precomputed Parquet tables in data/app,
# which must be committed; peak memory with all ten cancer types is listed in docs/DEPLOY.md.
#
# Render injects PORT itself; deployment steps are in docs/DEPLOY.md.
services:
  - type: web
    name: sctcna
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SCTCNA_DATA_DIR
        value: /app/data/app
