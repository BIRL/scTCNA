[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sctcna"
version = "0.1.0"
description = "scTCNA: a single-cell RNA-seq version of The Cancer Noise Atlas"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "scanpy==1.12.4",
    "anndata==0.13.4",
    "scrublet==0.2.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "scikit-learn==1.9.1",
    "h5py==3.16.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "tqdm==4.70.1",
    "fastapi==0.142.3",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "playwright==1.63.0",
    "pytest-playwright==0.9.0",
    "ruff==0.16.10",
]

[tool.setuptools]
packages = ["sctcna", "app"]

[tool.ruff]
line-length = 180
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["e2e: browser smoke tests (need Playwright Chromium)"]
