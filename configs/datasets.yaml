# Pipeline parameters. Every value below is an scTCNA choice (the TCNA manuscript
# concerns bulk RNA-seq and does not define single-cell thresholds); see METHODS.md.
params:
  qc:
    min_genes_per_cell: 200
    min_counts_per_cell: 500
    max_pct_mito: 20.0
    min_cells_per_gene: 10
    mito_prefix: "MT-"
    run_scrublet: true
    scrublet_min_cells_per_sample: 100
  sampling:
    max_cells_per_patient_compartment: 3000
    seed: 0
  groups:
    min_cells_per_group: 20          # patient x compartment groups below this are dropped
    min_patients_per_test: 6         # paired tests need at least this many patients (n = 5 cannot reach p < 0.05)
    min_cells_per_celltype_group: 50 # patient x cell-type groups for lineage-level metrics
  normalisation:
    target_sum: 10000                # counts per 10k (CP10K); log2(CP10K + 1) for DEPTH/DEPTH2
  metrics:
    min_detection_rate: 0.10         # gene must be detected in >= 10% of cells (median over patients) to enter tests / top lists
    lowess_frac: 0.3                 # mean-CV2 trend fit
  downsampling:
    enabled: true
    depth_quantile: 0.10             # common UMI depth = 10th percentile of per-cell totals (floor below)
    min_depth: 1000
  depth:
    min_detection_rate_genes: 0.01   # genes used for DEPTH/DEPTH2 must be detected in >= 1% of cells of the dataset
