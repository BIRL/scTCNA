# Dataset registry for scTCNA.
#
# Primary source: 3CA (Curated Cancer Cell Atlas, Weizmann Institute; Gavish et al.,
# Nature 2023). 3CA study bundles are hosted on Dropbox; each bundle contains
# Exp_data_UMIcounts.mtx (genes x cells, raw UMI counts), Genes.txt, Cells.csv and
# Samples.csv. The matching Meta-data bundle carries the curated cell-type calls
# ("Malignant" vs annotated non-malignant lineages) and patient identifiers.
#
# Secondary source: TISCH2 (Han et al., NAR 2023), new domain tisch.compbio.cn.
# TISCH2 matrices are log1p(counts-per-10k) rather than raw counts; the loader
# inverts the per-cell scaling to recover integer UMI counts and verifies integrality.
#
# `enabled: true` datasets are the ones used for the published tables.
# URLs were taken from the 3CA cancer-type pages on 2026-10-08.

sources:
  3CA:
    name: Curated Cancer Cell Atlas (3CA)
    url: https://www.weizmann.ac.il/sites/3CA/
    citation: "Gavish A, Tyler M, Greenwald AC, et al. Hallmarks of transcriptional intratumour heterogeneity across a thousand tumours. Nature 618, 598-606 (2023)."
  TISCH2:
    name: Tumor Immune Single-cell Hub 2 (TISCH2)
    url: https://tisch.compbio.cn/
    citation: "Han Y, Wang Y, Dong X, et al. TISCH2: expanded datasets and new tools for single-cell transcriptome analyses of the tumor microenvironment. Nucleic Acids Res 51, D1425-D1431 (2023)."

